services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sensework
      POSTGRES_PASSWORD: sensework
      POSTGRES_DB: sensework
    ports:
      - "5432:5432"
    volumes:
      - sensework_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensework -d sensework"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sensework:sensework@db:5432/sensework?schema=public
      JWT_SECRET: docker-dev-secret-change-me-please
      NODE_ENV: production
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sensework_pg:
